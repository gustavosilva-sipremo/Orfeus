<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fundo Black OLED com leve degradê do centro para as bordas -->
    <radialGradient id="oled-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#121216"/>
      <stop offset="60%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Degradê premium e minimalista para o símbolo -->
    <linearGradient id="symbol-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CCCCCC"/>
    </linearGradient>
  </defs>

  <!-- Container do ícone com canto arredondado (padrão PWA / iOS / Android) -->
  <rect width="512" height="512" rx="112" fill="url(#oled-bg)"/>

  <!-- Símbolo Fiel Vetorizado -->
  <g transform="translate(100, 56) scale(0.625)" fill="url(#symbol-gradient)">
    <path d="M 130,0 L 200,0 L 200,105 L 430,25 L 430,95 L 200,175 L 200,205 L 430,125 L 430,195 L 200,275 L 200,430 C 200,490 230,520 285,520 C 340,520 400,450 460,330 L 500,330 C 420,490 340,580 260,580 C 170,580 130,520 130,420 L 130,300 L 0,350 L 0,280 L 130,230 L 130,200 L 0,250 L 0,180 L 130,130 Z" />
  </g>
</svg>
